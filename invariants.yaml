version: 1
invariants:
  # raw_data_immutable — source_record.raw_data and raw_description are never
  # updated or deleted. Highest-priority invariant (ARCHITECTURE-PROPOSAL.md §793,
  # §823-825). Enforced at DB level by trigger in M1; in M0 by static check over
  # migration + application source.
  - name: raw_data_immutable
    description: |
      source_record.raw_data and raw_description are never updated or deleted.
    kind: forbid_regex
    severity: error
    scan_paths: [backend]
    exclude_globs: ["**/alembic/versions/*.py.orig"]
    patterns:
      # An UPDATE that assigns raw_data or raw_description is the violation.
      # This is a POSITIVE match. An earlier draft used a negative lookahead here,
      # which inverted the logic: it would have ignored exactly the illegal
      # statement and flagged the legal one instead.
      - '(?i)\bUPDATE\s+source_record\s+SET\b[^;]*\braw_(data|description)\b'
      # DELETE FROM source_record must NOT appear
      - '(?i)\bDELETE\s+FROM\s+source_record\b'
      # UPDATE source_record SET status = 'booked' is OK and must NOT be flagged:
      # it touches neither raw_data nor raw_description. Covered by a negative
      # test in tests/invariants/.

  # no_cross_schema_fk — no foreign keys across Postgres schemas.
  # One DB, one schema per module (finance, later health, tasks).
  # Cross-module reads go through views owned by a read-only dashboard module.
  # Enforced by DB grants + importlinter.
  # Rule: REFERENCES with no schema qualifier (= public.) is same-schema and allowed.
  # Only explicitly-qualified *different* schema trips the check.
  # Regex scanning raw SQL in Python migration files is inherently approximate —
  # not parser-grade; see comment in checker.
  - name: no_cross_schema_fk
    description: |
      no foreign keys across Postgres schemas. REFERENCES with no schema qualifier
      (= public.) is same-schema and allowed. Only explicitly-qualified *different*
      schema trips the check.
    kind: forbid_regex
    severity: error
    scan_paths: [backend]
    patterns:
      # REFERENCES <schema>.<table> where <schema> is explicitly qualified and is
      # not public. Handles both bare (REFERENCES health.account) and quoted
      # (REFERENCES "health".account) forms -- the closing quote sits AFTER the
      # schema name, which an earlier draft got wrong and so missed quoted refs.
      - '(?i)\bREFERENCES\s+(?!\s*"?public"?\s*\.\s*)"?([a-z_][a-z0-9_]*)"?\s*\.'

  # migrations_immutable — applied migrations are never edited.
  # M0: empty manifest (no applied migrations yet). Lane A creates empty versions/ dirs.
  # Only revisions that have been applied belong in the manifest; fabricating entries
  # would be dishonest — the negative test proves the check actually works.
  - name: migrations_immutable
    description: |
      applied migrations are never edited.
    kind: manifest
    severity: error
    manifest: scripts/migrations.lock.json
    scan_paths: [backend]
    # In M0 the manifest is empty (no applied revisions). New unapplied migrations
    # are allowed (they have not been applied yet). Fabricating entries is dishonest.

  # fingerprint_frozen — backend/finance/ingestion/fingerprint.py is SHA-256 hash-pinned.
  # Editing it breaks replay: old raw_data must stay parseable and replay must
  # reproduce the entry exactly. Frozen once shipped (invariant).
  - name: fingerprint_frozen
    description: |
      backend/finance/ingestion/fingerprint.py is SHA-256 hash-pinned.
      Editing it breaks replay: old raw_data must stay parseable and replay must
      reproduce the entry exactly.
    kind: hash
    severity: error
    path: backend/finance/ingestion/fingerprint.py
    sha256: "bcc0ae458799c88db5c5d31037c707bcf18d4f8b4df23ad4b1b89b5ca594b469"