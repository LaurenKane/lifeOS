# Alembic config for the finance schema.
#
# One Postgres database, one schema per module (section E). core/ and finance/
# are schemas in the SAME database, not separate databases, so both .ini files
# carry the same URL; they differ only in script_location and version table
# schema, which is what keeps their revision histories independent.
#
# `versions/` starts empty. Bead LifeOS-6 (M1) writes the first revision,
# including the deferrable balance trigger and the raw_data_immutable trigger.
#
# Run from `backend/`:
#     alembic -c finance/alembic.ini upgrade head

[alembic]
script_location = finance/alembic
prepend_sys_path = .
# The password belongs in LIFEOS_DATABASE_URL, never in this file.
sqlalchemy.url = postgresql://lifeos:lifeos@localhost:5432/lifeos

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
level = INFO
formatter = generic
args = (sys.stderr,)

[formatter_generic]
format = %(levelname)s - %(name)s - %(message)s
datefmt = %Y-%m-%d %H:%M:%S