# Alembic config for the life schema.
#
# Mirrors finance/alembic.ini: one Postgres database, one schema per module
# (ADR 0005/0010); only script_location and version_table_schema differ, which
# is what keeps each schema's revision history independent.
#
# Run from `backend/`:
#     alembic -c life/alembic.ini upgrade head

[alembic]
script_location = life/alembic
prepend_sys_path = .
# The password belongs in LIFEOS_DATABASE_URL, never in this file.
sqlalchemy.url = postgresql://lifeos:lifeos@localhost:5432/lifeos

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
level = INFO
formatter = generic
args = (sys.stderr,)

[formatter_generic]
format = %(levelname)s - %(name)s - %(message)s
datefmt = %Y-%m-%d %H:%M:%S
