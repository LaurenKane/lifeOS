[alembic]
script_location = core/alembic
sqlalchemy.url = postgresql://lifeos:lifeos@localhost:5432/lifeos_core

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
level = INFO
formatter = generic
formatter = generic

[formatter_generic]
format = %(levelname)s - %(name)s - %(message)s
datefmt = %Y-%m-%d %H:%M:%S