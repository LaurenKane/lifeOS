# Life OS CI.
#
# Three jobs, and every gate in this file corresponds to a target in the Makefile
# that runs the same command locally. If a job can fail, there is a way to
# reproduce that failure without CI.
#
# `check` is the one that must pass anywhere: ruff, mypy --strict, pytest.
# `db` is separate because it needs a PostgreSQL service container, and a
# failure to provision one reads as nothing like an assertion failure.
# `egress-test` is separate because it needs a *host kernel* the runner has to
# be configured to provide: see the strace and user-namespace discussion below.

name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Cancels superseded runs on the same ref. On a feature branch the newest push
# is the only one worth testing, and nobody is waiting on the previous commit's
# mypy output.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Pin the uv version rather than tracking latest: a resolver upgrade would
  # change which lockfile is considered current, and every command here runs
  # --frozen, so drift between pyproject.toml and uv.lock fails the build.
  UV_VERSION: "0.11.8"

jobs:
  # =========================================================================
  # Backend gates: lint, typecheck, unit tests
  # =========================================================================

  check:
    name: check (ruff, mypy --strict, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --frozen: fail rather than re-resolve, so the environment can never
      # drift from the committed lockfile without an edit.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: ruff check
        run: uv run --frozen ruff check backend

      - name: ruff format --check
        run: uv run --frozen ruff format --check backend

      # --strict with disallow_any_explicit is set in pyproject.toml and must
      # not be relaxed. The targeted `# type: ignore[explicit-any]` comments
      # on pydantic model classes are deliberate: pydantic's own generics widen
      # the type, and those classes are verified not to mask a real Any.
      - name: mypy
        run: uv run --frozen mypy --strict backend

      # testpaths in pyproject.toml covers backend/tests, the finance module's
      # own tests, and the repo-level tests/ directory. The addopts there
      # deselects everything marked `db`, so this is the whole non-DB suite.
      #
      # `--ignore=tests/egress` is deliberate. pyproject.toml's testpaths would
      # otherwise collect the zero-egress tests here too, and that is the wrong
      # job for them: this one installs no strace and provisions no network
      # namespace, so the egress tests would SKIP — and a skip in this job's log
      # is precisely the thing that reads as coverage. One gate, one job. The
      # `egress-test` job below installs the harness, refuses to skip, and is
      # reproducible with `make egress-test-ci`.
      #
      # Locally, `make test` still collects them (and skips leniently if you
      # have no strace). The divergence is in the lenient direction, which is
      # the safe direction: a laptop is never the thing enforcing this claim.
      - name: pytest
        run: uv run --frozen pytest --ignore=tests/egress

  # =========================================================================
  # DB-backed tests — the balance trigger
  # =========================================================================

  # These are the M1 acceptance criteria — a balanced entry commits, an
  # unbalanced one is rejected AT COMMIT, the re-parent exploit is caught — and
  # they are marked `db`, which pytest's addopts deselect by default. The
  # `-m db` below overrides that selection rather than adding to it.
  db:
    name: db (pytest -m db, real Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # NOT pinned by digest, unlike docker-compose.yml, and that asymmetry is
        # deliberate. A compose service here holds a development database that
        # someone may be looking at; a CI service container is created empty for
        # one job and destroyed with the runner. Pinning it would fail CI on an
        # unrelated upstream tag rotation, in a job nobody can reproduce locally,
        # for a database that is thrown away either way. The version itself
        # matches compose's `postgres:17-alpine`, which IS what makes a local
        # `make test-db` a reproduction of this job.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Points at the `postgres` maintenance database on purpose: the fixture
      # creates and migrates its own `lifeos_test` and never touches the database
      # named here. Role name matches the `GRANT ... TO lifeos` in
      # backend/db_bootstrap.sql.
      LIFEOS_TEST_DATABASE_URL: postgresql://lifeos:lifeos@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: uv sync --frozen --extra dev

      # The fixture builds lifeos_test from backend/db_bootstrap.sql and then
      # runs `alembic upgrade head` for core and finance, so this runs the REAL
      # migrations — including the deferrable balance trigger, which
      # `Base.metadata.create_all()` would not create at all and which is the
      # entire subject of these tests.
      - name: balance trigger and schema drift
        run: uv run --frozen pytest -m db -v

  # =========================================================================
  # Zero-egress gate — the offline file-import path makes no network calls
  # =========================================================================

  # This is a security gate, not a code-quality one. The app holds a live
  # Enable Banking PSD2 credential (SAFETY.md), and tests/egress/ is the only
  # thing that proves importing a local statement file issues zero `connect()`
  # calls. ARCHITECTURE.md §8 asserts that property; this job checks it.
  #
  # It is a separate job rather than a step in `check` for two reasons.
  # First, its preconditions are host properties, not Python dependencies:
  # `strace` is not in the ubuntu-24.04 image's package list, and
  # `unshare -Urn` is blocked by AppArmor there. Both are handled below.
  # Second, a failing step inside a big `check` job reads as "the suite is
  # broken", when what actually happened is "the sandbox could not be built".
  #
  # It has one job-specific trap that is the entire reason this comment is
  # long. The egress tests degrade gracefully by design — a machine without
  # strace skips them, a machine without user namespaces falls back to
  # strace-only observation — and both of those are a SKIP. A skip in a CI log
  # is indistinguishable from a pass. So:
  #
  #   LIFEOS_REQUIRE_EGRESS=1   set here, and only here, turning every one of
  #                            those degradations into a hard failure.
  #                            `make egress-test-ci` sets the same variable,
  #                            which is what makes this job reproducible.
  egress-test:
    name: egress-test (zero connect() calls, strict)
    runs-on: ubuntu-24.04
    env:
      # See above. Without this the job could go green having checked nothing.
      LIFEOS_REQUIRE_EGRESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `strace` is absent from the ubuntu-24.04 image's apt package list, and
      # it is the only thing in this harness that *records* a connect()
      # attempt. Installing it explicitly rather than assuming it is there is
      # the difference between a gate and a hope. `util-linux` carries
      # `unshare`; it is a required package so it is always present already,
      # and naming it here means the step fails loudly if that ever changes.
      - name: Install the egress harness (strace, unshare)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace util-linux
          strace -V | head -1
          unshare --version

      # ubuntu-24.04 sets kernel.apparmor_restrict_unprivileged_userns=1, which
      # refuses `unshare -Urn` for an unprivileged process — and the runner is
      # an unprivileged user. The failure mode is the dangerous one: the
      # namespace silently disappears, the tests drop to strace-only
      # observation, and the job reports a skip. Relax it on this throwaway
      # runner so the namespace belt is actually present.
      #
      # Worth being precise about what this gives up: AppArmor's restriction
      # exists to stop an unprivileged process from gaining capabilities by
      # nesting a user namespace. This job then runs repo code inside one,
      # which is precisely the capability being tested — so the runner is
      # configured for a test that is designed to make that capability useless
      # (no interfaces, no route, nothing to connect to). The alternative,
      # leaving it on, does not make the runner safer *and* keep the gate; it
      # just makes the gate test something weaker without saying so.
      #
      # The probe afterwards is the hard gate. If the sysctl is unavailable,
      # unwritable, or insufficient, this step fails — it does not fall
      # through to a strace-only run that would pass for the wrong reason.
      - name: Probe the network namespace, and fail loudly if it is absent
        run: |
          if ! unshare -Urn -- /bin/true 2>/dev/null; then
            echo "::notice::unprivileged user namespaces are blocked (AppArmor); relaxing the restriction on this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
              echo "::warning::could not relax kernel.apparmor_restrict_unprivileged_userns"
          fi
          unshare -Urn -- /bin/true
          echo "network namespace available: $(unshare -Urn -- ip -o link 2>/dev/null | wc -l) interface(s)"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: uv sync --frozen --extra dev

      # The explicit path, not bare `pytest`, so testpaths cannot quietly stop
      # covering tests/egress. --junit-xml is for the verification step below.
      - name: pytest tests/egress
        run: uv run --frozen pytest tests/egress -v --junit-xml=egress.xml

      # A green pytest is necessary but not sufficient: `5 passed` and
      # `0 tests ran` are the same exit code, and the second one is the
      # failure this whole job exists to prevent. Read the report the run
      # actually produced and require each test by name, with no <skipped>,
      # <failure> or <error> child. Redundant with LIFEOS_REQUIRE_EGRESS on
      # purpose — that guards the tests' own logic, this guards the invocation.
      - name: assert the egress claim was actually checked
        run: |
          uv run --frozen python - egress.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          REQUIRED = (
              "test_offline_import_makes_no_connect_calls",
              "test_the_strace_harness_detects_a_connect_call",
              "test_strace_is_available",
              "test_the_trace_file_is_actually_written",
              "test_unshare_namespace_is_available_or_reported",
          )

          report = ET.parse(sys.argv[1]).getroot()
          outcomes = {
              case.get("name"): [child.tag for child in case]
              for case in report.iter("testcase")
          }

          problems = []
          for name in REQUIRED:
              seen = outcomes.get(name)
              if seen is None:
                  problems.append(f"{name}: never ran (not collected, or deselected)")
              elif seen:
                  problems.append(f"{name}: reported {', '.join(seen)}")

          if problems:
              sys.exit(
                  "the egress gate did not check what it claims to check:\n  "
                  + "\n  ".join(problems)
              )
          print(f"all {len(REQUIRED)} egress tests ran, and none of them skipped")
          PY
