[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# backend/ is the IMPORT ROOT, not a package. `sources = ["backend"]` strips the
# prefix so `core/` and `finance/` install as top-level sibling packages
# (ARCHITECTURE.md §3: core/ is a SIBLING of finance/, not a parent). That is
# what makes `from core.money import Money` correct.
# `packages = ["backend"]` would install a `backend.*` package instead, which
# breaks every absolute import and does not match the console-script target
# (`main:app`).
[tool.hatch.build.targets.wheel]
only-include = ["backend"]
sources = ["backend"]

[project]
name = "lifeos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    # [binary] bundles libpq, so `uv sync` on a bare host works with no system
    # libpq. ADR 0004 settles the bare-vs-binary tradeoff; see
    # docs/adr/0004-psycopg-binary-distribution.md to revert.
    "psycopg[binary]",
    "httpx",
    # Required by FastAPI for any route taking an UploadFile (multipart forms).
    # The imports router needs it; without it the app fails to start.
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[project.scripts]
lifeos = "main:app"
lifeos-cli = "cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C", "T"]

[tool.ruff.lint.per-file-ignores]
# Alembic env.py files are exec'd by Alembic, not imported as a package, so the
# `context` symbol only exists at runtime.
"backend/*/alembic/env.py" = ["E402", "F821"]
# Generated revision stubs follow Alembic's fixed layout, and the CLI's whole
# job is printing to stdout.
"backend/*/alembic/versions/*.py" = ["E501"]
# A command line that cannot print is not a command line: reporting a replay
# on stdout (and refusing one on stderr) is what `cli.py` is for.
"backend/cli.py" = ["T201"]
# FastAPI's dependency-injection idiom is a call in a default argument.
"backend/finance/api/routes/imports.py" = ["B008"]

[tool.mypy]
strict = true
disallow_any_explicit = true
warn_unreachable = true
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
# backend/ is the import root, so `core` and `finance` are top-level packages.
mypy_path = "backend"
explicit_package_bases = false

[tool.pytest.ini_options]
# backend/tests is cross-module only; a module's own tests live beside it in
# backend/finance/tests/. `tests/` holds repo-level tests (zero-egress).
testpaths = ["backend/tests", "backend/finance/tests", "tests"]
# backend/ is the import root, so `core` and `finance` are top-level packages.
pythonpath = ["backend"]
# DB-backed tests are OPT-IN, and `make test` stays Docker-free.
#
# `-m` has pytest's `store` action, so a `-m db` on the command line replaces
# this value rather than adding to it. That is the whole mechanism: `make test`
# runs `pytest` and deselects everything marked `db`; `make test-db` runs
# `pytest -m db` and runs only those. Nothing here starts a database.
addopts = "-m 'not db'"
# Without this, `-m db` warns about an unknown mark, and a typo'd marker name
# would silently select nothing - a green gate over zero tests.
markers = [
    "db: requires a real Postgres. Run `make test-db` (and `make up-db` first); it builds a throwaway lifeos_test database from the real migrations.",
]
