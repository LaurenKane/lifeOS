[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# backend/ is the IMPORT ROOT, not a package. `sources = ["backend"]` strips the
# prefix so `core/` and `finance/` install as top-level sibling packages
# (docs/ARCHITECTURE-PROPOSAL.md section D: core/ is a SIBLING of finance/,
# not a parent). That is what makes `from core.money import Money` correct.
# `packages = ["backend"]` would install a `backend.*` package instead, which
# breaks every absolute import and does not match the console-script targets
# (`main:app`, `finance.background.worker:main`).
[tool.hatch.build.targets.wheel]
only-include = ["backend"]
sources = ["backend"]

[project]
name = "lifeos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "httpx",
    # Required by FastAPI for any route taking an UploadFile (multipart forms).
    # The imports router needs it; without it the app fails to start.
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "import-linter",
    # tests/invariants/ parses invariants.yaml.
    "pyyaml",
]

[project.scripts]
lifeos = "main:app"
lifeos-worker = "finance.background.worker:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C", "T"]

[tool.ruff.lint.per-file-ignores]
# Alembic env.py files are exec'd by Alembic, not imported as a package, so the
# `context` symbol only exists at runtime.
"backend/*/alembic/env.py" = ["E402", "F821"]
# Generated revision stubs follow Alembic's fixed layout, and the CLI's whole
# job is printing to stdout.
"backend/*/alembic/versions/*.py" = ["E501"]
"backend/finance/background/worker.py" = ["T201"]
# FastAPI's dependency-injection idiom is a call in a default argument.
"backend/finance/api/routes/imports.py" = ["B008"]

[tool.mypy]
strict = true
disallow_any_explicit = true
warn_unreachable = true
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
# backend/ is the import root, so `core` and `finance` are top-level packages.
mypy_path = "backend"
explicit_package_bases = false

[tool.pytest.ini_options]
# backend/tests is cross-module only (section D); a module's own tests live
# beside it in backend/finance/tests/. `tests/` holds repo-level invariant tests.
testpaths = ["backend/tests", "backend/finance/tests", "tests"]
# backend/ is the import root, so `core` and `finance` are top-level packages.
pythonpath = ["backend"]